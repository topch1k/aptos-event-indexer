services:
  postgres:
    image: postgres:16
    container_name: aptos_indexer_postgres
    environment:
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: indexer
      POSTGRES_DB: indexer
    ports:
      - "5432:5432"
    volumes:
      - indexer_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "indexer", "-d", "indexer"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  indexer_pg_data:
